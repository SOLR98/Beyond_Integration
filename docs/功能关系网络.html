<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyond Integration — 功能关系网络</title>
<link rel="stylesheet" href="style.css">
<style>
.net-wrap { max-width: 1180px; margin: 0 auto; padding: 24px 24px 80px; }

.legend { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; margin: 6px 0 14px; font-size: 13px; color: var(--text-dim); }
.legend .item { display: flex; align-items: center; gap: 7px; }
.legend .swatch { width: 26px; height: 0; border-top: 2px solid var(--text-dim); }
.legend .swatch.dashed { border-top-style: dashed; }
.legend .dot { width: 12px; height: 12px; border-radius: 3px; border: 2px solid; display: inline-block; }
.legend .dot.main { border-color: var(--yellow); }
.legend .dot.bi   { border-color: var(--accent); }
.legend .dot.feat { border-color: var(--green); }
.legend .dot.ext  { border-color: var(--purple); }
.legend .dot.eco  { border-color: var(--accent-2); border-style: dashed; }

.net-card {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    overflow-x: auto;
}
.net-card svg { display: block; width: 100%; min-width: 900px; height: auto; }

/* ---------- 节点 ---------- */
.node rect {
    fill: var(--card);
    stroke: var(--text-dim);
    stroke-width: 1.6;
    transition: stroke-width .12s, filter .12s, opacity .12s;
}
.node .title { fill: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
.node .sub   { fill: var(--text-dim); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 10.5px; text-anchor: middle; }

.node.main rect { stroke: var(--yellow); }
.node.main .title { fill: var(--yellow); }
.node.bi rect { stroke: var(--accent); }
.node.bi .title { fill: var(--accent-2); }
.node.feat rect { stroke: var(--green); }
.node.feat .title { fill: var(--green); }
.node.ext rect  { stroke: var(--purple); }
.node.ext .title { fill: var(--purple); }
.node.eco rect  { stroke: var(--accent-2); stroke-dasharray: 5 4; }
.node.eco .title { fill: var(--accent-2); }

/* ---------- 边 ---------- */
.edge {
    fill: none;
    stroke: var(--text-dim);
    stroke-width: 1.6;
    opacity: .55;
    transition: opacity .12s, stroke .12s, stroke-width .12s;
    marker-end: url(#arrow);
}
.edge.hub { stroke: var(--accent); }
.edge.dashed { stroke-dasharray: 6 5; }

/* ---------- 交互态 ---------- */
.node.active rect { stroke-width: 3; filter: drop-shadow(0 0 6px rgba(77,163,255,.55)); }
.node.dimmed { opacity: .18; }
.node.neighbor rect { stroke-width: 2.6; }
.edge.active { opacity: 1; stroke-width: 2.4; stroke: var(--accent-2); }
.edge.dimmed { opacity: .07; }

/* 第三方图层开关 */
svg.hide-ext .ext { display: none; }

.controls { margin: 10px 0 0; font-size: 13px; color: var(--text-dim); display: flex; gap: 20px; flex-wrap: wrap; }
.controls label { cursor: pointer; user-select: none; }
.controls input { vertical-align: middle; margin-right: 5px; }

.hint { font-size: 12.5px; color: var(--text-dim); margin-top: 10px; }
</style>
</head>

<script>
(function () {
    var svg = document.getElementById('net');
    var nodes = Array.prototype.slice.call(document.querySelectorAll('.node'));
    var edges = Array.prototype.slice.call(document.querySelectorAll('.edge'));

    function nodeById(id) {
        return document.querySelector('.node[data-id="' + id + '"]');
    }

    function clearStates() {
        nodes.forEach(function (n) { n.classList.remove('active', 'dimmed', 'neighbor'); });
        edges.forEach(function (e) { e.classList.remove('active', 'dimmed'); });
    }

    nodes.forEach(function (n) {
        n.addEventListener('mouseenter', function () {
            var id = n.dataset.id;
            clearStates();
            nodes.forEach(function (x) {
                if (x === n) { x.classList.add('active'); }
                else { x.classList.add('dimmed'); }
            });
            edges.forEach(function (e) {
                if (e.dataset.from === id || e.dataset.to === id) {
                    e.classList.add('active');
                    var otherId = e.dataset.from === id ? e.dataset.to : e.dataset.from;
                    var other = nodeById(otherId);
                    if (other) { other.classList.remove('dimmed'); other.classList.add('neighbor'); }
                } else {
                    e.classList.add('dimmed');
                }
            });
        });
        n.addEventListener('mouseleave', clearStates);
    });

    var toggleExt = document.getElementById('toggleExt');
    toggleExt.addEventListener('change', function () {
        svg.classList.toggle('hide-ext', !toggleExt.checked);
    });

    var toggleEco = document.getElementById('toggleEco');
    toggleEco.addEventListener('change', function () {
        document.querySelectorAll('.node.eco').forEach(function (n) {
            n.style.display = toggleEco.checked ? '' : 'none';
        });
        document.querySelectorAll('.edge.eco').forEach(function (e) {
            e.style.display = toggleEco.checked ? '' : 'none';
        });
    });
})();
</script>
