plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10'
}

version = mod_version
group = mod_group_id

// jar 名称格式与 1.20.1-FORGE 保持一致：beyond_integration-<mc>-<loader>-<version>.jar
// 注意：NeoGradle moddev 会覆盖 base.archivesName，故直接在 jar 任务上强制命名
tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-${minecraft_version}-neoforge-${mod_version}.jar"
}

repositories {
    // CurseForge 工件只走 CurseMaven，避免被 NeoForged 仓库的 /curse/maven 路径抢先解析（VPN 下会 reset）
    exclusiveContent {
        forRepository { mavenLocal() }
        forRepository { maven { url "https://cursemaven.com" } }
        filter { includeGroup "curse.maven" }
    }
    // 标准库/注解固定走 Maven Central，避免被 NeoForged 仓库的偶发 reset 拖垮整条解析
    exclusiveContent {
        forRepository { mavenLocal() }
        forRepository { mavenCentral() }
        filter { includeGroup "org.jetbrains"; includeGroup "org.jetbrains.kotlin"; includeGroup "org.jetbrains.kotlinx" }
    }
    mavenLocal()
    mavenCentral()
    maven {
        name = "CompixelUI"
        url = "https://maven.wintercogs.com/releases"
        content {
            includeGroup "dev.compixel"
        }
    }
    maven {
        url = "https://maven.blamejared.com"
    }
    maven { url 'https://modmaven.dev/' }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    // kubejs
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }

    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" }
    maven {
        url 'https://maven.aliyun.com/repository/public'
    }
}


base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Kotlin / Compose（用于 BD 新版 Compixel UI 的附属界面，如 BdPage 注入页）
kotlin {
    jvmToolchain(21)
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    // ── 批量导入：mods/ 下所有 jar 自动进入编译 + 运行时类路径 ──
    // NeoForge 的 mod jar 使用官方映射，可直接以文件方式引入（无需去混淆）。
    implementation fileTree(dir: 'mods', include: ['*.jar'])

    // EMI 在源码中没有直接引用（EmiBdCompat 只按 ModList / 类名门控），无需编译期本地 jar；
    // 运行期由玩家自行安装 EMI。移除 libs/ 依赖后 clone 即可构建。

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
    implementation "curse.maven:beyond-dimensions-1222890:8812500"

    implementation "curse.maven:irons-lib-1492763:8973642"
    implementation "curse.maven:kotlin-for-forge-351264:8335665"
    implementation "curse.maven:playeranimator-658587:7389814"

    implementation "curse.maven:irons-spells-n-spellbooks-855414:8680204"
    implementation "curse.maven:goety-586095:9207885"
    implementation "curse.maven:geckolib-388172:7707149"
    implementation "curse.maven:sodium-394468:6382651"
    implementation "curse.maven:cloth-config-348521:5729127"
    implementation "curse.maven:curios-309927:6529130"
    implementation "curse.maven:jei-238222:7420587"
    implementation "curse.maven:sophisticated-core-618298:8140101"
    implementation "curse.maven:sophisticated-storage-619320:8136817"
    implementation "curse.maven:create-328085:7963363"
    implementation "curse.maven:patchouli-306770:7730942"
    implementation "curse.maven:limitless-vehicle-1446269:8068686"
    // 哨戒机械臂（1.21.1 移植）公开版只有 1.4.x，硬性要求 TACZ >= 1.2.0；本分支目标 TACZ 1.1.8，
    // 装上会直接 Mod loading failed，因此开发运行时不再引入（原为本地 libs/sentry-1.3.6.jar）。
    // implementation "curse.maven:create-sentry-mechanical-arm-repairs-extensions-1791865:9624673"
    // Ponder 是该移植自带的 jarJar 运行时依赖，源码无直接引用，不再单独引入本地 jar
    implementation "curse.maven:touhou-little-maid-355044:8061852"
    implementation "curse.maven:winefoxs-spellbooks-1379815:8607005"

    implementation "curse.maven:superb-warfare-1218165:8104860"
    implementation "curse.maven:tacz-1-21-1-1353462:8127849"
    implementation "curse.maven:tacz-addon-1238419:9069262"
    implementation "curse.maven:jade-324717:7545219"
    implementation "curse.maven:placebo-283644:8463693"
    implementation "curse.maven:apothic-enchanting-1063926:8469450"
    implementation "curse.maven:apothic-attributes-898963:8502288"
    implementation "curse.maven:apothic-spawners-986583:8469405"
    implementation "curse.maven:apotheosis-313970:8564919"
    implementation "curse.maven:thirst-was-reclaimed-884742:8893710"
    implementation "curse.maven:legendary-survival-overhaul-840254:8597620"
}

// 适配诊断：提高 javac 错误上限，避免只看到前 100 条；统一 UTF-8 源码编码。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
